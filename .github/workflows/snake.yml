name: Snake

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#0f7a55&color_dots=#ebedf0,#bfe8d6,#7fdcb4,#2e9e6b,#0f7a55
            dist/snake-dark.svg?palette=github-dark&color_snake=#7fdcb4&color_dots=#161b22,#1d4a39,#2e9e6b,#7fdcb4,#bfe8d6
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
